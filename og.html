<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Anteprima link · Sempre in Linea</title>
<meta name="viewport" content="width=1200">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<!-- config.js viene generato da render.mjs copiando CONFIG da index.html -->
<script src="config.js"></script>
<style>
:root {
  --bg: #04090A; --border: #1C2B2A; --text: #EEF4F2; --muted: #8FA3A0; --soft: #C3D0CD;
  --teal: #2CCFAE; --teal-glow: rgba(44, 207, 174, 0.35); --alarm: #FF2B2B; --alarm-glow: rgba(255, 43, 43, 0.45);
  --serif: "Instrument Serif", Georgia, serif; --sans: "Inter Tight", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative; isolation: isolate;
  background: var(--bg); color: var(--text); font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  display: grid; grid-template-columns: 1fr 380px; gap: 36px; align-items: center;
  padding: 0 72px;
}
body::before {
  content: ""; position: absolute; z-index: -1; left: 50%; top: 0;
  width: 1500px; height: 1500px; border-radius: 50%;
  transform: translate(-50%, -86%);
  background: radial-gradient(closest-side,
    rgba(44, 207, 174, 0) 70%, rgba(44, 207, 174, 0.08) 82%, rgba(44, 207, 174, 0.42) 92%,
    rgba(120, 240, 214, 0.85) 96.5%, rgba(44, 207, 174, 0) 100%);
  filter: blur(12px);
}
body::after {
  content: ""; position: absolute; z-index: -2; inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(44, 207, 174, 0.2), rgba(44, 207, 174, 0) 75%),
    radial-gradient(rgba(143, 163, 160, 0.13) 1.3px, transparent 1.9px) 0 0 / 20px 20px;
}
.logo { display: flex; align-items: center; gap: 12px; font: 400 34px/1 var(--serif); }
.logo i { width: 13px; height: 13px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 14px var(--teal-glow); }
h1 { margin-top: 26px; font: 400 72px/1 var(--serif); letter-spacing: -0.01em; }
h1 em { color: var(--teal); padding-right: 0.06em; }
.wave { margin-top: 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 3px; }
.wave i { flex: 1; max-width: 6px; border-radius: 3px; background: var(--teal); }

.right { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 70px; }
.label { font: 700 22px/1 var(--mono); color: var(--alarm); text-shadow: 0 0 12px var(--alarm-glow); }
.tiles { display: flex; gap: 12px; }
.tile {
  width: 168px; height: 136px; display: grid; place-items: center;
  background: #000; border: 2px solid var(--alarm); border-radius: 18px;
  font: 700 70px/1 var(--mono); color: var(--alarm);
  text-shadow: 0 0 22px var(--alarm-glow), 0 0 3px rgba(255, 43, 43, 0.5);
  box-shadow: 0 0 30px -8px var(--alarm-glow);
}
.badge {
  width: 100%; padding: 20px 12px; border-radius: 16px; text-align: center;
  background: var(--teal); color: #03110E;
  font: 600 23px/1.2 var(--sans); white-space: nowrap;
  box-shadow: 0 0 0 5px rgba(44, 207, 174, 0.14), 0 16px 40px -14px var(--teal-glow);
}
</style>
</head>
<body>
  <div>
    <div class="logo"><i></i>Sempre in Linea</div>
    <h1>Quante chiamate hai<br><em>perso</em> questa settimana?</h1>
    <div class="wave" data-bars="72"></div>
  </div>
  <div class="right">
    <p class="label">Il pilota chiude il</p>
    <div class="tiles"><div class="tile" data-day>20</div><div class="tile" data-month>NOV</div></div>
    <p class="badge">Pilota gratuito · solo <span data-total>3</span> posti</p>
  </div>
<script src="shared.js"></script>
</body>
</html>
